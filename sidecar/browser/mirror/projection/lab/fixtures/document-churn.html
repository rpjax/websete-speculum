<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Document churn</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }
      #ready {
        padding: 1rem;
        background: #dcfce7;
        border: 2px solid #16a34a;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div id="ready">ready</div>
    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        const mode = params.get('mode') || 'meta';
        const slowMs = Number(params.get('slowMs') || '400');
        const churnCount = Number(params.get('n') || '3');

        function stablePage() {
          document.open();
          document.write(
            '<!doctype html><html><head><meta charset="utf-8"><title>stable</title></head><body><div id="ready">ready</div></body></html>',
          );
          document.close();
        }

        function churnMeta(i) {
          const meta = document.createElement('meta');
          meta.httpEquiv = 'refresh';
          meta.content = '0;url=' + location.pathname + '?mode=js&n=' + i;
          document.head.appendChild(meta);
        }

        function churnJs(i) {
          if (i <= 0) {
            stablePage();
            return;
          }
          document.open();
          document.write('<html><head></head><body>churn ' + i + '</body></html>');
          document.close();
          setTimeout(() => churnJs(i - 1), 50);
        }

        function churnSlow(i) {
          if (i <= 0) {
            stablePage();
            return;
          }
          document.open();
          document.write('<html><head></head><body>slow ' + i + '</body></html>');
          document.close();
          setTimeout(() => churnSlow(i - 1), slowMs);
        }

        function churnInterstitial(i) {
          if (i <= 0) {
            stablePage();
            return;
          }
          document.open();
          document.write(
            '<html><head><meta http-equiv="refresh" content="0;url=' +
              location.pathname +
              '?mode=interstitial&n=' +
              (i - 1) +
              '"></head><body>interstitial</body></html>',
          );
          document.close();
        }

        if (mode === 'meta' && churnCount > 0) {
          churnMeta(churnCount);
        } else if (mode === 'js') {
          churnJs(churnCount);
        } else if (mode === 'slow') {
          churnSlow(churnCount);
        } else if (mode === 'interstitial') {
          churnInterstitial(churnCount);
        }
      })();
    </script>
  </body>
</html>
