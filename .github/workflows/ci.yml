name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  dotnet:
    name: refactor-dotnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore unit tests
        run: |
          dotnet restore Speculum.Api.Journal.Tests/Speculum.Api.Journal.Tests.csproj
          dotnet restore Speculum.Api.Sessions.Tests/Speculum.Api.Sessions.Tests.csproj
          dotnet restore Speculum.Api.Telemetry.Tests/Speculum.Api.Telemetry.Tests.csproj
      - name: Test Journal
        run: >
          dotnet test Speculum.Api.Journal.Tests/Speculum.Api.Journal.Tests.csproj
          -c Release --verbosity normal
      - name: Test Sessions
        run: >
          dotnet test Speculum.Api.Sessions.Tests/Speculum.Api.Sessions.Tests.csproj
          -c Release --verbosity normal
      - name: Test Telemetry
        run: >
          dotnet test Speculum.Api.Telemetry.Tests/Speculum.Api.Telemetry.Tests.csproj
          -c Release --verbosity normal

  sidecar:
    name: refactor-sidecar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome (K5 / PP Chromium probes)
        uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Install and test
        working-directory: sidecar
        env:
          # Fail closed for projectedK5 — no silent skip when Chrome is available on CI.
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          npm ci
          npm test

  web:
    name: refactor-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build page-projection package
        working-directory: packages/page-projection
        run: npm run build
      - name: Install, lint, test, and build
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  page-projection-oracles:
    name: page-projection-oracles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and run O1–O5 fixture gates + PP-DEN-2 baseline
        working-directory: page-projection-oracles
        run: |
          npm ci
          npm test
          node bin/run-o4-density-baseline.cjs
      - name: Upload PP-DEN-2 baseline
        uses: actions/upload-artifact@v4
        with:
          name: pp-den-2-baseline
          path: page-projection-oracles/artifacts/pp-den-2-baseline.json
          if-no-files-found: error

  compose:
    name: refactor-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate sessions-test compose
        run: docker compose -f deploy/compose/docker-compose.sessions-test.yml config
      - name: Validate nouinput override file
        run: |
          set -euo pipefail
          test -f deploy/compose/docker-compose.dev.nouinput.yml
          # Override is applied against generated out/dev compose locally; file presence is the CI check.
          grep -q 'SPECULUM_INPUT_BACKEND' deploy/compose/docker-compose.dev.nouinput.yml

  dockup:
    name: refactor-dockup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dockup
        run: npm install -g @rodrigopjax/dockup@2.0.2
      - name: Validate dockup manifest
        working-directory: deploy
        run: dockup validate -c dockup.json --root ..

  sessions-test:
    name: sessions-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build sessions-test stack
        run: docker compose -f deploy/compose/docker-compose.sessions-test.yml up -d --build

      - name: Wait for fixture + API health
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:18090/health/ready >/dev/null \
              && docker compose -f deploy/compose/docker-compose.sessions-test.yml exec -T fixture \
                   node -e "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" \
              && docker compose -f deploy/compose/docker-compose.sessions-test.yml exec -T sidecar \
                   curl -sf http://127.0.0.1:3001/ready >/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "stack did not become healthy in time" >&2
            docker compose -f deploy/compose/docker-compose.sessions-test.yml ps >&2 || true
            exit 1
          fi

      - name: Seed opt-in Journal (explicit enable)
        run: |
          chmod +x deploy/compose/seed-sessions-test.sh
          SESSIONS_TEST_API_BASE=http://127.0.0.1:18090 \
            ./deploy/compose/seed-sessions-test.sh

      - name: Run PageProjection SessionsTest (product)
        env:
          SESSIONS_TEST_API_BASE: http://127.0.0.1:18090
        run: >
          dotnet test Speculum.Api.SessionsTest.Tests/Speculum.Api.SessionsTest.Tests.csproj
          -c Release --filter "Category=PageProjection" --verbosity normal

      - name: Run SessionsTest tests
        env:
          SESSIONS_TEST_API_BASE: http://127.0.0.1:18090
        run: >
          dotnet test Speculum.Api.SessionsTest.Tests/Speculum.Api.SessionsTest.Tests.csproj
          -c Release --filter "Category=SessionsTest&Category!=PageProjection" --verbosity normal

      - name: Collect compose logs on failure
        if: failure()
        run: |
          mkdir -p "${{ runner.temp }}/sessions-test-logs"
          docker compose -f deploy/compose/docker-compose.sessions-test.yml logs --no-color > "${{ runner.temp }}/sessions-test-logs/compose.log" || true

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sessions-test-failure
          path: ${{ runner.temp }}/sessions-test-logs/
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose/docker-compose.sessions-test.yml down -v --remove-orphans
