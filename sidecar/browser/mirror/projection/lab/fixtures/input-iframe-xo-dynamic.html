<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cross-origin iframe input (dynamic insert)</title>
    <style>
      body { margin: 304px 0 0 24px; font-family: Georgia, serif; background: #f7f4ee; }
      #state { margin: 0 0 8px; font: 14px/1.4 sans-serif; color: #432; }
      iframe { width: 320px; height: 140px; border: 2px solid #432; background: #fff; }
    </style>
  </head>
  <body>
    <h1>Cross-origin iframe input (JS after load)</h1>
    <p id="state">state: boot</p>
    <div id="mount"></div>
    <script>
      const setState = (text) => {
        const el = document.getElementById('state');
        if (el) el.textContent = text;
      };
      window.addEventListener('load', () => {
        setState('state: load-fired');
        fetch('/lab/config.json')
          .then((r) => r.json())
          .then((cfg) => {
            const mount = document.getElementById('mount');
            if (!mount) {
              setState('state: mount-miss');
              return;
            }
            const xo = cfg.crossOriginOrigin || 'http://127.0.0.1:4078';
            const iframe = document.createElement('iframe');
            iframe.id = 'xo-child';
            iframe.title = 'xo-nested-child-dynamic';
            iframe.src = xo + '/fixtures/input-xo/inner.html';
            iframe.addEventListener('load', () => setState('state: iframe-ready'));
            mount.appendChild(iframe);
            setState('state: iframe-inserted');
          })
          .catch(() => setState('state: config-fail'));
      });
    </script>
  </body>
</html>
