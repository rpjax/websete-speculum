<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Speculum Sessions — demo</title>
    <script type="importmap">
      {
        "imports": {
          "@microsoft/signalr": "https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/+esm",
          "@microsoft/signalr-protocol-msgpack": "https://cdn.jsdelivr.net/npm/@microsoft/signalr-protocol-msgpack@8.0.7/+esm",
          "@msgpack/msgpack": "https://cdn.jsdelivr.net/npm/@msgpack/msgpack@3.1.2/+esm"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", system-ui, sans-serif;
        --ink: #1a1a1a;
        --muted: #5c5c5c;
        --line: #d6d6d6;
        --bg: #f7f5f1;
        --panel: #fff;
        --accent: #0b5fff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      header {
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: end;
      }
      h1 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      label {
        display: grid;
        gap: 0.25rem;
        font-size: 0.75rem;
        color: var(--muted);
      }
      input {
        min-width: 16rem;
        padding: 0.45rem 0.6rem;
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
      }
      button {
        padding: 0.5rem 0.9rem;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button.secondary {
        background: #333;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 22rem;
        gap: 0;
        min-height: 0;
      }
      @media (max-width: 900px) {
        main { grid-template-columns: 1fr; }
      }
      .stage {
        display: grid;
        place-items: center;
        background: #111;
        min-height: 50vh;
        position: relative;
      }
      canvas {
        max-width: 100%;
        max-height: 100%;
        image-rendering: auto;
        cursor: crosshair;
      }
      .hint {
        position: absolute;
        inset: auto 1rem 1rem 1rem;
        color: #bbb;
        font-size: 0.8rem;
        pointer-events: none;
      }
      aside {
        border-left: 1px solid var(--line);
        background: var(--panel);
        padding: 0.75rem;
        overflow: auto;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 0.75rem;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Speculum session client demo</h1>
        <div style="color:var(--muted);font-size:0.8rem">/vhub + /vtransport</div>
      </div>
      <label>
        Profile id
        <input id="profileId" placeholder="guid" autocomplete="off" />
      </label>
      <label>
        Path
        <input id="path" value="/" autocomplete="off" />
      </label>
      <button id="start" type="button">Start</button>
      <button id="stop" class="secondary" type="button" disabled>Stop</button>
      <button id="status" class="secondary" type="button" disabled>Status</button>
      <button id="back" class="secondary" type="button" disabled>Back</button>
      <button id="forward" class="secondary" type="button" disabled>Forward</button>
      <div id="lastInput" style="color:var(--muted);font-size:0.8rem;align-self:center">last input: —</div>
    </header>
    <main>
      <section class="stage">
        <canvas id="frame" width="1280" height="720" tabindex="0"></canvas>
        <div class="hint" id="hint">Connect requires HTTPS HTTP/3 for WebTransport (localhost http ok in Chromium).</div>
      </section>
      <aside id="log"></aside>
    </main>

    <script type="module" src="./demo.js"></script>
  </body>
</html>
