<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Layer B</title>
    <style>
      body { margin: 0; background: #083344; color: #cffafe; font: 14px/1.3 sans-serif; overflow: hidden; }
      #stage { position: relative; width: 100vw; height: 48%; }
      #box {
        position: absolute;
        left: 40%;
        top: 30%;
        width: 72px;
        height: 72px;
        background: #22d3ee;
        border-radius: 10px;
        will-change: transform;
      }
      #hud {
        position: absolute;
        z-index: 3;
        top: 8px;
        left: 10px;
        margin: 0;
        padding: 6px 8px;
        font: 11px/1.35 ui-monospace, Consolas, monospace;
        white-space: pre;
        background: rgba(8, 28, 36, 0.82);
        color: #cffafe;
      }
      iframe {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 12px;
        width: calc(100% - 24px);
        height: 52%;
        border: 3px solid #a5f3fc;
        background: #022c22;
      }
    </style>
  </head>
  <body>
    <pre id="hud">waiting</pre>
    <div id="stage"><div id="box"></div></div>
    <iframe id="nested" src="iframe-anim-c.html" title="layer-c"></iframe>
    <script src="iframe-anim-work.js"></script>
  </body>
</html>
