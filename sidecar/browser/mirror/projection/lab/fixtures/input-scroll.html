<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Input scroll fixture</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1a1f2e;
        --paper: #f4f1ea;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--paper);
        color: var(--ink);
      }
      header {
        padding: 1rem 1.25rem 0.5rem;
      }
      header h1 {
        margin: 0;
        font-size: 1.35rem;
        letter-spacing: -0.02em;
      }
      header p {
        margin: 0.35rem 0 0;
        color: #5a6172;
        font-size: 0.95rem;
      }
      #readout {
        display: inline-block;
        margin-top: 0.6rem;
        padding: 0.25rem 0.55rem;
        border-radius: 4px;
        background: #1a1f2e;
        color: #f6f3ec;
        font: 600 0.85rem/1.3 ui-monospace, Consolas, monospace;
      }
      #scroller {
        height: min(520px, calc(100vh - 8rem));
        margin: 0.75rem 1.25rem 1.5rem;
        overflow: auto;
        border: 2px solid #1a1f2e;
        border-radius: 8px;
        background: #0f121a;
        box-shadow: 0 12px 28px rgb(26 31 46 / 18%);
        scroll-behavior: auto;
      }
      .track {
        position: relative;
        min-height: 2400px;
      }
      .band {
        display: grid;
        grid-template-columns: 88px 1fr auto;
        align-items: center;
        gap: 1rem;
        min-height: 120px;
        padding: 0 1.25rem;
        border-bottom: 1px solid rgb(255 255 255 / 18%);
        color: #fff;
        font-weight: 700;
        font-size: 1.15rem;
        letter-spacing: 0.02em;
        text-shadow: 0 1px 0 rgb(0 0 0 / 35%);
      }
      .band .tick {
        font: 700 1.6rem/1 ui-monospace, Consolas, monospace;
        opacity: 0.95;
      }
      .band .label {
        font-size: 1.05rem;
      }
      .band .hint {
        font-size: 0.8rem;
        font-weight: 600;
        opacity: 0.85;
      }
      .band:nth-child(6n + 1) {
        background: linear-gradient(90deg, #e4572e, #f0a202);
      }
      .band:nth-child(6n + 2) {
        background: linear-gradient(90deg, #2a9d8f, #57cc99);
      }
      .band:nth-child(6n + 3) {
        background: linear-gradient(90deg, #3d5a80, #98c1d9);
      }
      .band:nth-child(6n + 4) {
        background: linear-gradient(90deg, #7b2cbf, #c77dff);
      }
      .band:nth-child(6n + 5) {
        background: linear-gradient(90deg, #d62828, #f77f00);
      }
      .band:nth-child(6n + 6) {
        background: linear-gradient(90deg, #023e8a, #00b4d8);
      }
      .ruler {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        gap: 0.5rem;
        padding: 0.45rem 0.75rem;
        background: rgb(15 18 26 / 88%);
        color: #f6f3ec;
        font: 600 0.8rem/1.2 ui-monospace, Consolas, monospace;
        backdrop-filter: blur(4px);
        border-bottom: 1px solid rgb(255 255 255 / 20%);
      }
      .chevrons {
        position: absolute;
        left: 50%;
        top: 40%;
        transform: translateX(-50%);
        color: rgb(255 255 255 / 55%);
        font-size: 2rem;
        letter-spacing: 0.15em;
        pointer-events: none;
        animation: bob 1.1s ease-in-out infinite;
      }
      @keyframes bob {
        0%,
        100% {
          transform: translate(-50%, 0);
        }
        50% {
          transform: translate(-50%, 10px);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Input M1c — scroll parity</h1>
      <p>
        Wheel inside the box. Colored bands should glide continuously on Projected and Virtual —
        stutter, jump, or lag is a fail by eye.
      </p>
      <div id="readout">scrollTop: 0</div>
    </header>
    <div id="scroller">
      <div class="ruler">sticky · watch bands pass under this bar</div>
      <div class="track" id="track">
        <div class="chevrons" aria-hidden="true">↓ ↓ ↓</div>
      </div>
    </div>
    <script>
      (function () {
        var track = document.getElementById('track');
        var scroller = document.getElementById('scroller');
        var readout = document.getElementById('readout');
        var labels = [
          'SUNRISE',
          'LAGOON',
          'STEEL',
          'VIOLET',
          'EMBER',
          'OCEAN',
        ];
        for (var i = 0; i < 20; i++) {
          var band = document.createElement('div');
          band.className = 'band';
          band.dataset.y = String(i * 120);
          var tick = document.createElement('span');
          tick.className = 'tick';
          tick.textContent = String(i * 120).padStart(4, '0');
          var label = document.createElement('span');
          label.className = 'label';
          label.textContent = labels[i % labels.length] + ' · strip ' + (i + 1);
          var hint = document.createElement('span');
          hint.className = 'hint';
          hint.textContent = 'y≈' + i * 120 + 'px';
          band.appendChild(tick);
          band.appendChild(label);
          band.appendChild(hint);
          track.appendChild(band);
        }
        var update = function () {
          readout.textContent = 'scrollTop: ' + Math.round(scroller.scrollTop);
        };
        scroller.addEventListener('scroll', update, { passive: true });
        update();
      })();
    </script>
  </body>
</html>
