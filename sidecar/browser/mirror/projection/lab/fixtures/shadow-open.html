<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Open shadow</title>
    <style>
      body { margin: 1.5rem; font-family: Georgia, serif; background: #f4f7fb; }
      #host { border: 2px solid #234; padding: 8px; margin: 8px 0; background: #fff; }
      #state { margin: 0 0 8px; font: 14px/1.4 sans-serif; color: #234; }
    </style>
  </head>
  <body>
    <h1>Open named shadow</h1>
    <p id="state">state: boot</p>
    <div id="host">
      light-out
      <span slot="title">named</span>
      <template shadowrootmode="open">
        <style>#inner { color: crimson; }</style>
        <slot name="title"></slot>
        <p id="inner">declarative</p>
      </template>
    </div>
    <div id="script-host"></div>
    <div id="nested-host"></div>
    <div id="focus-host"></div>
    <button type="button" id="mutate">mutate</button>
    <button type="button" id="drop-host">drop host</button>
    <script>
      const scriptHost = document.getElementById('script-host');
      const scriptRoot = scriptHost.attachShadow({ mode: 'open' });
      const adopted = new CSSStyleSheet();
      adopted.replaceSync('#from-adopted { color: navy; }');
      scriptRoot.adoptedStyleSheets = [adopted];
      scriptRoot.innerHTML = '<span id="from-adopted">scripted</span><slot></slot>';

      const nestedHost = document.getElementById('nested-host');
      const outer = nestedHost.attachShadow({ mode: 'open' });
      const innerHost = document.createElement('div');
      innerHost.id = 'inner-host';
      outer.appendChild(innerHost);
      const inner = innerHost.attachShadow({ mode: 'open' });
      inner.innerHTML = '<em id="nested-leaf">nested</em>';

      const focusHost = document.getElementById('focus-host');
      focusHost.attachShadow({ mode: 'open', delegatesFocus: true });

      const setState = (text) => {
        const el = document.getElementById('state');
        if (el) el.textContent = text;
      };
      const acts = {
        mutate() {
          const host = document.getElementById('host');
          const p = host.shadowRoot.querySelector('#inner');
          p.textContent = 'MUTATED';
          p.style.cssText = 'color:#062;font-weight:700;background:#c6f5c6;padding:4px 8px;';
          if (!host.shadowRoot.querySelector('#post-boot')) {
            const extra = document.createElement('span');
            extra.id = 'post-boot';
            extra.textContent = ' AFTER';
            extra.style.cssText = 'background:#fd0;color:#000;font-weight:700;padding:2px 8px;margin-left:8px;';
            host.shadowRoot.appendChild(extra);
          }
          host.style.background = '#ffe08a';
          setState('state: mutated');
        },
        dropHost() {
          document.getElementById('host')?.remove();
          setState('state: host dropped');
        },
      };
      document.getElementById('mutate').onclick = () => acts.mutate();
      document.getElementById('drop-host').onclick = () => acts.dropHost();
      window.__cssomLab = {
        act(name) {
          const fn = acts[name];
          if (typeof fn !== 'function') return { ok: false, reason: 'unknown act ' + name };
          fn();
          return { ok: true, act: name };
        },
      };
    </script>
  </body>
</html>
