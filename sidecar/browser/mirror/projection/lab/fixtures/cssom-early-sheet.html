<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>CSSOM — folha presente no load (controle do plano)</title>
    <!-- HTTPMARK já no HTML inicial: existe antes do bootstrap (readyState COMPLETE). -->
    <link rel="stylesheet" id="http-link" href="cssom-late-sheet.css" />
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 24px; background: rgb(250, 250, 250); }
      .box { padding: 16px; margin: 12px 0; border: 1px solid rgb(200, 200, 200); }
      #ctrl-marker, #data-marker { background-color: rgb(190, 190, 190); }
    </style>
    <script>
      // Folha construída + insertRule durante o parse — também anterior ao bootstrap.
      const early = new CSSStyleSheet();
      early.insertRule(
        '#ctrl-marker { background-color: rgb(0, 90, 200); color: rgb(255,255,255); outline: 3px solid rgb(0,90,200); }',
      );
      for (let i = 1; i <= 20; i++) early.insertRule('.ctrlmark-' + i + ' { --CTRLMARK: ' + i + '; }');
      document.addEventListener('DOMContentLoaded', () => {
        document.adoptedStyleSheets = [early];
        document.getElementById('ctrlRules').textContent = String(early.cssRules.length);
        let n = 0;
        for (const s of document.styleSheets) {
          if ((s.href || '').includes('cssom-late-sheet.css')) {
            try {
              n = s.cssRules.length;
            } catch {
              n = -1;
            }
          }
        }
        document.getElementById('httpRules').textContent = String(n);
        document.getElementById('httpOutcome').textContent = 'parsed-in-html';
        document.getElementById('phase').textContent = 'early-done';
      });
    </script>
  </head>
  <body>
    <h1>CSSOM early sheet</h1>
    <div class="box" id="ctrl-marker">CTRL — construída no parse (azul se chegou)</div>
    <div class="box" id="data-marker">DATA — não usado nesta fixture</div>
    <div class="box" id="http-marker">HTTP — link no HTML inicial (laranja se chegou)</div>
    <div class="box">
      fase: <span id="phase">boot</span><br />
      virtualCtrlRules: <span id="ctrlRules">0</span> ·
      virtualDataRules: <span id="dataRules">0</span> ·
      virtualHttpRules: <span id="httpRules">0</span><br />
      httpLinkOutcome: <span id="httpOutcome">pending</span>
    </div>
  </body>
</html>
