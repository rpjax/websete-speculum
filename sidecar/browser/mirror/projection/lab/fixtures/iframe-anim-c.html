<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Layer C</title>
    <style>
      body { margin: 0; background: #052e16; color: #bbf7d0; font: 14px/1.3 sans-serif; overflow: hidden; }
      #stage { position: relative; width: 100vw; height: 100vh; }
      #box {
        position: absolute;
        left: 40%;
        top: 40%;
        width: 72px;
        height: 72px;
        background: #4ade80;
        border-radius: 10px;
        will-change: transform;
      }
      #hud {
        position: absolute;
        z-index: 3;
        top: 6px;
        left: 8px;
        margin: 0;
        padding: 6px 8px;
        font: 11px/1.35 ui-monospace, Consolas, monospace;
        white-space: pre;
        background: rgba(5, 24, 14, 0.82);
        color: #bbf7d0;
      }
    </style>
  </head>
  <body>
    <pre id="hud">waiting</pre>
    <div id="stage"><div id="box"></div></div>
    <script src="iframe-anim-work.js"></script>
  </body>
</html>
