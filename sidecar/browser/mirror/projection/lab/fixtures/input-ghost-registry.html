<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Input ghost registry fixture</title>
    <style>
      body {
        font-family: ui-monospace, Consolas, monospace;
        margin: 1.25rem;
        background: #101820;
        color: #e8eef4;
      }
      #hud {
        display: grid;
        gap: 0.35rem;
        margin-bottom: 1rem;
        font-size: 0.85rem;
      }
      #hud span[data-k]::before {
        content: attr(data-k) ': ';
        opacity: 0.65;
      }
      button {
        min-height: 44px;
        min-width: 160px;
        font: inherit;
        cursor: pointer;
      }
      #click-target[data-clicked='1'] {
        background: #2a6f4e;
        border-color: #3ecf8e;
      }
      iframe {
        width: 100%;
        height: 72px;
        border: 1px solid rgb(255 255 255 / 22%);
        margin: 0.5rem 0;
      }
    </style>
  </head>
  <body>
    <h1>Ghost registry (load-after-drop)</h1>
    <div id="hud">
      <span data-k="phase" id="phase">boot</span>
      <span data-k="iframes_spawned" id="iframes-spawned">0</span>
      <span data-k="iframes_removed" id="iframes-removed">0</span>
      <span data-k="drop_gate" id="drop-gate">0</span>
    </div>
    <p>
      Same-origin iframe whose <code>load</code> hangs on <code>/hang</code>. Diag opens
      <code>/drop-gate</code> after Projected is awaiting, then releases <code>/hang</code> so
      <code>load</code> fires after <code>dropNestedHost</code> — registry ghost.
    </p>
    <div id="iframe-slot"></div>
    <button id="click-target" type="button" data-clicked="0">Click target</button>
    <script>
      (function () {
        var phaseEl = document.getElementById('phase');
        var spawnedEl = document.getElementById('iframes-spawned');
        var removedEl = document.getElementById('iframes-removed');
        var gateEl = document.getElementById('drop-gate');
        var slot = document.getElementById('iframe-slot');
        var spawned = 0;
        var removed = 0;
        var dropped = false;

        function setPhase(text) {
          if (phaseEl) phaseEl.textContent = text;
        }

        function spawn(label, src) {
          var frame = document.createElement('iframe');
          frame.title = label;
          frame.src = src;
          slot.appendChild(frame);
          spawned += 1;
          if (spawnedEl) spawnedEl.textContent = String(spawned);
          return frame;
        }

        function removeFrame(frame) {
          if (!frame || !frame.parentNode) return;
          frame.parentNode.removeChild(frame);
          removed += 1;
          if (removedEl) removedEl.textContent = String(removed);
        }

        document.getElementById('click-target').addEventListener('click', function () {
          this.setAttribute('data-clicked', '1');
        });

        setPhase('spawn_hanging');
        var hanging = spawn('hanging', 'input-ghost-registry-inner.html');

        var poll = setInterval(function () {
          fetch('/drop-gate', { cache: 'no-store' })
            .then(function (r) {
              return r.json();
            })
            .then(function (j) {
              if (gateEl) gateEl.textContent = j.drop ? '1' : '0';
              if (!j.drop || dropped) return;
              dropped = true;
              clearInterval(poll);
              setPhase('drop_before_load');
              removeFrame(hanging);
              setPhase('awaiting_late_load');
              setTimeout(function () {
                setPhase('ghosts_ready');
              }, 2000);
            })
            .catch(function () {
              /* gate not ready */
            });
        }, 200);

        // Safety: if diag never opens the gate, still drop after 25s so the page settles.
        setTimeout(function () {
          if (dropped) return;
          dropped = true;
          clearInterval(poll);
          setPhase('drop_before_load_timeout');
          removeFrame(hanging);
          setPhase('awaiting_late_load');
          setTimeout(function () {
            setPhase('ghosts_ready');
          }, 2000);
        }, 25000);

        window.__ghostLab = {
          getPhase: function () {
            return phaseEl ? phaseEl.textContent : '';
          },
          clickState: function () {
            var el = document.getElementById('click-target');
            return el ? el.getAttribute('data-clicked') : null;
          },
        };
      })();
    </script>
  </body>
</html>
