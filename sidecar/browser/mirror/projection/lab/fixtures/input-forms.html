<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Input forms fixture</title>
  </head>
  <body>
    <h1>Input M1b</h1>
    <label>Name <input id="field" type="text" value="" /></label>
    <p id="mirror" data-value="">empty</p>
    <form id="search-form">
      <label>Search <input id="search-field" type="search" value="" /></label>
    </form>
    <p id="submit-state" data-state="idle">idle</p>
    <script>
      const field = document.getElementById('field');
      const mirror = document.getElementById('mirror');
      field.addEventListener('input', () => {
        mirror.textContent = field.value;
        mirror.setAttribute('data-value', field.value);
      });
      document.getElementById('search-form').addEventListener('submit', function (e) {
        e.preventDefault();
        document.getElementById('submit-state').setAttribute('data-state', 'submitted');
        document.getElementById('submit-state').textContent = 'submitted';
      });
    </script>
  </body>
</html>
