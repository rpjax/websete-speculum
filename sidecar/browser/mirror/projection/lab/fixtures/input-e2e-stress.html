<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Input E2E stress</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #0f1419;
        color: #e8eef4;
      }
      .hud {
        position: sticky;
        top: 0;
        z-index: 20;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 0.5rem;
        padding: 0.55rem 0.85rem;
        background: rgb(15 20 25 / 94%);
        border-bottom: 1px solid rgb(255 255 255 / 14%);
        font: 600 0.75rem/1.25 ui-monospace, Consolas, monospace;
      }
      .hud span[data-k]::before {
        content: attr(data-k) ": ";
        opacity: 0.65;
        font-weight: 500;
      }
      header {
        padding: 1rem 1.25rem 0.5rem;
      }
      header h1 {
        margin: 0 0 0.35rem;
        font-size: 1.15rem;
      }
      header p {
        margin: 0;
        opacity: 0.78;
        font-size: 0.9rem;
        max-width: 52rem;
      }
      .section {
        padding: 0.75rem 1.25rem 1.25rem;
      }
      .section h2 {
        margin: 0 0 0.55rem;
        font-size: 0.95rem;
      }
      #click-grid {
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        gap: 0.35rem;
      }
      #click-grid button {
        min-height: 40px;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 6px;
        background: #1c2a38;
        color: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      #click-grid button.hit {
        background: #2a6f4e;
        border-color: #3ecf8e;
      }
      .forms {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
      }
      .forms input[type="text"] {
        min-width: 220px;
        padding: 0.45rem 0.6rem;
        border-radius: 6px;
        border: 1px solid rgb(255 255 255 / 22%);
        background: #101820;
        color: inherit;
      }
      #panel-farm {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 0.65rem;
      }
      .panel {
        height: 160px;
        overflow: auto;
        border: 2px solid #4c6ef5;
        border-radius: 8px;
        background: #0b1016;
      }
      .panel .band {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 48px;
        padding: 0 0.55rem;
        border-bottom: 1px solid rgb(255 255 255 / 12%);
        font-weight: 700;
        font-size: 0.75rem;
      }
      .panel .band:nth-child(odd) {
        background: linear-gradient(90deg, #364fc7, #748ffc);
      }
      .panel .band:nth-child(even) {
        background: linear-gradient(90deg, #0b7285, #22b8cf);
      }
      iframe#child {
        width: 100%;
        height: 360px;
        border: 2px solid #e67700;
        border-radius: 8px;
        background: #fff;
      }
      .page-lanes .lane {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 96px;
        margin: 0.45rem 0;
        padding: 0 1rem;
        border-radius: 8px;
        font-weight: 800;
      }
      .page-lanes .lane:nth-child(odd) {
        background: linear-gradient(90deg, #c92a2a, #f76707);
      }
      .page-lanes .lane:nth-child(even) {
        background: linear-gradient(90deg, #1864ab, #15aabf);
      }
    </style>
  </head>
  <body>
    <div class="hud" id="hud">
      <span data-k="clicks" id="hud-clicks">0</span>
      <span data-k="keys" id="hud-keys">0</span>
      <span data-k="panels" id="hud-panels">0</span>
      <span data-k="panelScrollSum" id="hud-panel-sum">0</span>
      <span data-k="scrollY" id="hud-scroll-y">0</span>
      <span data-k="field" id="hud-field"></span>
    </div>

    <header>
      <h1>Input E2E stress</h1>
      <p>
        Click grid + forms + N overflow panels (query <code>?panels=</code>, default 48) + page
        viewport lanes + nested iframe. Used to stress ABS/scrollSet and measure multi-scroll census
        cost.
      </p>
    </header>

    <section class="section">
      <h2>Click grid</h2>
      <div id="click-grid"></div>
    </section>

    <section class="section">
      <h2>Forms</h2>
      <div class="forms">
        <label>field <input id="field" type="text" autocomplete="off" /></label>
        <label><input id="chk" type="checkbox" /> chk</label>
        <span id="mirror" data-value="">mirror:</span>
      </div>
    </section>

    <section class="section">
      <h2>Scroll panel farm</h2>
      <div id="panel-farm"></div>
    </section>

    <section class="section">
      <h2>Nested iframe</h2>
      <iframe id="child" title="inner" src="/fixtures/input-scroll-iframe-inner.html"></iframe>
    </section>

    <section class="section page-lanes" id="page-lanes">
      <h2>Page viewport lanes</h2>
    </section>

    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var panelCount = Math.max(1, Math.min(256, Number(params.get('panels') || 48) || 48));
        var bandCount = Math.max(8, Math.min(80, Number(params.get('bands') || 24) || 24));
        var laneCount = Math.max(8, Math.min(80, Number(params.get('lanes') || 28) || 28));

        var state = {
          clicks: 0,
          keys: 0,
          panels: panelCount,
          panelScrollSum: 0,
          scrollY: 0,
          field: '',
        };
        window.__stress = state;

        function paintHud() {
          document.getElementById('hud-clicks').textContent = String(state.clicks);
          document.getElementById('hud-keys').textContent = String(state.keys);
          document.getElementById('hud-panels').textContent = String(state.panels);
          document.getElementById('hud-panel-sum').textContent = String(state.panelScrollSum);
          document.getElementById('hud-scroll-y').textContent = String(state.scrollY);
          document.getElementById('hud-field').textContent = state.field;
        }

        function refreshPanelSum() {
          var sum = 0;
          document.querySelectorAll('#panel-farm .panel').forEach(function (el) {
            sum += el.scrollTop | 0;
          });
          state.panelScrollSum = sum;
          state.scrollY = window.scrollY | 0;
          paintHud();
        }

        var grid = document.getElementById('click-grid');
        for (var i = 0; i < 64; i++) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.id = 'cell-' + i;
          btn.setAttribute('data-cell', String(i));
          btn.textContent = String(i);
          btn.addEventListener('click', function (ev) {
            var t = ev.currentTarget;
            t.classList.add('hit');
            state.clicks += 1;
            paintHud();
          });
          grid.appendChild(btn);
        }

        var field = document.getElementById('field');
        var mirror = document.getElementById('mirror');
        field.addEventListener('input', function () {
          state.field = field.value;
          mirror.textContent = 'mirror:' + field.value;
          mirror.setAttribute('data-value', field.value);
          paintHud();
        });
        field.addEventListener('keydown', function () {
          state.keys += 1;
          paintHud();
        });

        var farm = document.getElementById('panel-farm');
        for (var p = 0; p < panelCount; p++) {
          var panel = document.createElement('div');
          panel.className = 'panel';
          panel.id = 'panel-' + p;
          panel.setAttribute('data-scroll', '1');
          for (var b = 0; b < bandCount; b++) {
            var band = document.createElement('div');
            band.className = 'band';
            band.innerHTML = '<span>P' + p + '</span><span>B' + b + '</span>';
            panel.appendChild(band);
          }
          panel.addEventListener('scroll', refreshPanelSum, { passive: true });
          farm.appendChild(panel);
        }

        var lanes = document.getElementById('page-lanes');
        for (var L = 0; L < laneCount; L++) {
          var lane = document.createElement('div');
          lane.className = 'lane';
          lane.innerHTML = '<span>LANE ' + L + '</span><span>y≈' + L * 96 + '</span>';
          lanes.appendChild(lane);
        }

        window.addEventListener('scroll', refreshPanelSum, { passive: true });
        paintHud();
        refreshPanelSum();
      })();
    </script>
  </body>
</html>
