# SessionsTest stack — Chrome + motor-fixture for Refactor Act→Assert.
# Usage (CI / local):
#   docker compose -f Refactor/deploy/compose/docker-compose.sessions-test.yml up -d --build
#   ./Refactor/deploy/compose/seed-sessions-test.sh
#   dotnet test Refactor/Speculum.Api.SessionsTest.Tests --filter Category=SessionsTest

name: sessions-test

services:
  fixture:
    build:
      context: ../../../tests/motor-fixture
      dockerfile: Dockerfile
    environment:
      FIXTURE_ROLE: good
      FIXTURE_HOSTNAME: fixture.test
      PORT: "443"
      HEALTH_PORT: "8090"
    networks:
      sessions-test:
        aliases:
          - fixture.test
          - www.fixture.test
          - sub.fixture.test

  sidecar:
    build:
      context: ../..
      dockerfile: sidecar/Dockerfile
    init: true
    cap_add:
      - SYS_ADMIN
      - MKNOD
    devices:
      - /dev/uinput:/dev/uinput
    device_cgroup_rules:
      - "c 10:223 rwm"
      - "c 13:* rwm"
    shm_size: 2gb
    environment:
      NODE_ENV: production
      SPECULUM_BROWSER: patchright
      SPECULUM_INPUT_BACKEND: patchright
      CHROME_EXECUTABLE: /usr/bin/google-chrome
      SPECULUM_GRPC_PORT: "50051"
      SPECULUM_HEALTH_PORT: "3001"
      SPECULUM_IGNORE_CERT_ERRORS: "1"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/ready"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 8
    networks:
      - sessions-test

  api:
    build:
      context: ../..
      dockerfile: Speculum.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      SPECULUM_WEBTRANSPORT_PORT: "8443"
      SPECULUM_BYPASS_API_AUTH: "true"
      Database__Path: /data/speculum.db
      Sidecar__GrpcAddress: "http://sidecar:50051"
      Telemetry__Host__ProcPath: /host/proc
      Telemetry__Docker__Endpoint: unix:///var/run/docker.sock
      Sessions__InputMultiplexingPolicy__Access: Shared
      ResourceManagement__Sessions__MaxConcurrentSessions: "10"
      Sessions__DetachedSessionTimeout: "00:05:00"
      Sessions__IsJsBridgeEnabled: "true"
      Sessions__ViewportPolicy__Default__Width: "1280"
      Sessions__ViewportPolicy__Default__Height: "720"
      Sessions__ViewportPolicy__Minimum__Width: "100"
      Sessions__ViewportPolicy__Minimum__Height: "100"
      Sessions__ViewportPolicy__Maximum__Width: "4096"
      Sessions__ViewportPolicy__Maximum__Height: "2160"
      Sessions__ClientEnvironmentPolicy__DefaultLocale: pt-BR
      Sessions__ClientEnvironmentPolicy__DefaultLanguage: pt-BR
      Sessions__ClientEnvironmentPolicy__DefaultTimeZoneId: America/Sao_Paulo
      Sessions__ClientEnvironmentPolicy__DefaultColorScheme: light
      Sessions__DeviceEmulationPolicy__Default__DeviceScaleFactor: "1"
      Sessions__DeviceEmulationPolicy__Default__UserAgentProfile: desktop
      Sessions__DeviceEmulationPolicy__Default__ScreenOrientation: landscapePrimary
      Sessions__DeviceEmulationPolicy__MinDeviceScaleFactor: "1"
      Sessions__DeviceEmulationPolicy__MaxDeviceScaleFactor: "2"
      Sessions__DeviceEmulationPolicy__MaxTouchPoints: "10"
      Sessions__DeviceEmulationPolicy__DefaultTouchPointsWhenTouch: "5"
      Sessions__DeviceEmulationPolicy__DesktopUserAgentProfile: desktop
      Sessions__DeviceEmulationPolicy__MobileUserAgentProfile: mobile
      Sessions__ScreencastPolicy__MaxEncodeScale: "2"
      Navigation__DefaultTargetHost: fixture.test
      Navigation__AllowedMainFrameUrls__0__Domain__Scope: Pattern
      Navigation__AllowedMainFrameUrls__0__Domain__Labels__0__Match: Exact
      Navigation__AllowedMainFrameUrls__0__Domain__Labels__0__Value: fixture
      Navigation__AllowedMainFrameUrls__0__Domain__Labels__1__Match: Exact
      Navigation__AllowedMainFrameUrls__0__Domain__Labels__1__Value: test
      Navigation__AllowedMainFrameUrls__1__Domain__Scope: Pattern
      Navigation__AllowedMainFrameUrls__1__Domain__Labels__0__Match: Any
      Navigation__AllowedMainFrameUrls__1__Domain__Labels__0__Value: ""
      Navigation__AllowedMainFrameUrls__1__Domain__Labels__1__Match: Exact
      Navigation__AllowedMainFrameUrls__1__Domain__Labels__1__Value: fixture
      Navigation__AllowedMainFrameUrls__1__Domain__Labels__2__Match: Exact
      Navigation__AllowedMainFrameUrls__1__Domain__Labels__2__Value: test
    volumes:
      - sessions-test-data:/data
      - /proc:/host/proc:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/w7s/health/ready"]
      interval: 10s
      timeout: 5s
      start_period: 25s
      retries: 12
    depends_on:
      sidecar:
        condition: service_healthy
      fixture:
        condition: service_healthy
    ports:
      - "18090:8080"
      - "18443:8443/tcp"
      - "18443:8443/udp"
    networks:
      - sessions-test

volumes:
  sessions-test-data:

networks:
  sessions-test:
    name: sessions-test
