server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Dom Projection serves proxied page assets under /w7s/api/.../dom-assets/*.
    # img-src must allow 'self' (and https for CSS url() absolutized to CDNs).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; connect-src 'self' ws: wss: https:; img-src 'self' blob: data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Control plane under /w7s (Traefik may also PathPrefix-route these).
    location /w7s/vhub {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # Muxed WebSocket data plane (Sessions.dataStreamTransport = webSocket).
    location /w7s/vstream {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # /w7s/vtransport is deliberately not proxied: WebTransport is HTTP/3 (QUIC) and
    # must reach Kestrel directly — prod maps host UDP :443 → api :8443/udp.

    location /w7s/api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /w7s/health {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Vite base `/w7s/` references `/w7s/assets/*` but emits files to `/assets/*`.
    # Do not combine alias with try_files — nginx resolves the wrong filesystem path.
    location /w7s/assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA surfaces (/w7s/admin, /w7s/lab, /w7s/setup) + Live catch-all (any other path).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
