server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # connect-src also covers WebTransport, which may target the API origin directly.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; connect-src 'self' ws: wss: https:; img-src blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Same-origin API (Traefik may also PathPrefix-route these; nginx covers SPA→api when web is the only entry).
    location /vhub {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # /vtransport is deliberately not proxied: WebTransport is HTTP/3 (QUIC) and
    # must reach Kestrel directly — prod maps host UDP :443 → api :8443/udp.

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Hashed Vite chunks must 404 when stale — never SPA-fallback HTML as JS.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
