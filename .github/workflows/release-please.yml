name: Release Please

# Only advance versioning after CI is green on a push to main.
# Feature PR commits never touch Release Please; only squash-merges to main do.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # write: dispatch Publish images after a release (GITHUB_TOKEN cannot chain
  # release→workflow events; workflow_dispatch is the supported exception).
  actions: write

jobs:
  release-please:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Dispatch Publish images
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            echo "release_created but tag_name is empty" >&2
            exit 1
          fi
          echo "Dispatching Publish images for ${TAG}"
          gh workflow run "Publish images" -R "$GH_REPO" -f "tag=${TAG}"
